name: WakaTime

on:
  schedule:
    - cron: "0 0 * * *" # daily, 00:00 UTC
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - uses: athul/waka-readme@master
        with:
          # Must be a WakaTime OAuth token (https://wakatime.com/oauth).
          # Plugin API keys (waka_...) can no longer read stats.
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          TIME_RANGE: last_7_days
          LANG_COUNT: 5
          SHOW_TIME: true
          SHOW_TOTAL: true
          COMMIT_MESSAGE: Update WakaTime stats
